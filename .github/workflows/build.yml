name: Build Smart Farmer APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check ZIP file
        run: |
          test -f smart_farmer_project.zip
          unzip -t smart_farmer_project.zip

      - name: Extract Flutter project
        run: |
          mkdir extracted
          unzip -q smart_farmer_project.zip -d extracted

          PUBSPEC=$(find extracted -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No pubspec.yaml found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android folder missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

            - name: Repair Android App Gradle file
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.agritech.smartfarmer"
              compileSdkVersion 34
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.agritech.smartfarmer"
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

          echo "Checking corrected app Gradle file:"
          cat -n android/app/build.gradle
