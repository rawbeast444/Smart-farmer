
name: Build Smart Farmer APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check ZIP file
        run: |
          test -f smart_farmer_project.zip || {
            echo "ERROR: smart_farmer_project.zip not found"
            exit 1
          }
          unzip -t smart_farmer_project.zip

      - name: Extract Flutter project
        run: |
          mkdir extracted
          unzip -q smart_farmer_project.zip -d extracted

          PUBSPEC=$(find extracted -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No pubspec.yaml found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android project folder is missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smart-farmer-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
