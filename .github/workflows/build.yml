
name: Build Smart Farmer APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check ZIP file
        run: |
          test -f smart_farmer_project.zip || {
            echo "ERROR: smart_farmer_project.zip not found"
            exit 1
          }
          unzip -t smart_farmer_project.zip

      - name: Extract Flutter project
        run: |
          mkdir -p extracted
          unzip -q smart_farmer_project.zip -d extracted

          PUBSPEC=$(find extracted -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: No pubspec.yaml found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android folder missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix project permissions
        run: |
          chmod -R u+rwX "$PROJECT_DIR"

      - name: Prepare Flutter assets and AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Restore Android launcher icon and themes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#2E7D32</color>
              <color name="launch_background_color">#FFFFFF</color>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>

              <style name="NormalTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/launch_background_color" />
          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,78 L54,48 C54,35 65,25 82,24 C81,41 72,52 54,54 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,61 C49,45 37,38 24,40 C25,55 36,65 54,67 Z" />
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="4"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000"
                  android:pathData="M54,78 L54,49" />
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Repair Android settings Gradle file
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream {
                      properties.load(it)
                  }
                  return properties.getProperty("flutter.sdk")
              }()

              assert flutterSdkPath != null : "Flutter SDK not found"

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.11.1" apply false
              id "org.jetbrains.kotlin.android" version "2.2.20" apply false
          }

          include ":app"
          EOF

      - name: Repair Android Gradle file
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > android/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Repair Android App Gradle file
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.agritech.smartfarmer"
              compileSdkVersion 35
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId "com.agritech.smartfarmer"
                  minSdkVersion 26
                  targetSdkVersion 34
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      - name: Update Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
          EOF

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smart-farmer-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
